name: GenSplit Close-Splits Agent

on:
  schedule:
    # Runs every 5 minutes — GitHub Actions minimum cron interval
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

jobs:
  close-splits:
    name: Close Fully Paid & Expired Splits
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run close-splits agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run agent:close-splits

      - name: Log completion
        run: echo "Agent run completed at $(date -u)"
